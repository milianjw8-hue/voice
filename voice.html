<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151B22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>음성 받아쓰기</title>
<style>
  :root {
    --ink: #151B22;
    --ink-soft: #5A6672;
    --paper: #EDF0F3;
    --line: #D3DAE1;
    --teal: #1F6F6B;
    --rec: #C8362B;
    --pad-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    font-size: 17px;
    line-height: 1.6;
  }

  header {
    flex: 0 0 auto;
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  #meta {
    margin-left: auto;
    font-size: 13px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  #status {
    flex: 0 0 auto;
    padding: 8px 18px;
    font-size: 13px;
    color: var(--ink-soft);
    background: #E3E8ED;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
  }

  #dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--ink-soft);
    flex: 0 0 auto;
  }

  body.recording #dot {
    background: var(--rec);
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  @media (prefers-reduced-motion: reduce) {
    body.recording #dot { animation: none; }
  }

  #sheet {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 18px 24px;
  }

  #text {
    white-space: pre-wrap;
    word-break: break-word;
    outline: none;
    min-height: 100%;
    font-size: var(--size, 18px);
  }

  #interim { color: var(--ink-soft); }

  #empty {
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.8;
  }

  footer {
    flex: 0 0 auto;
    border-top: 1px solid var(--line);
    background: var(--paper);
    padding: 12px 14px calc(12px + var(--pad-bottom));
  }

  #tools {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  .tool {
    flex: 1 1 28%;
    min-height: 46px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
  }

  .tool:active { background: #E3E8ED; }
  .tool:disabled { opacity: 0.4; }

  #mic {
    width: 100%;
    min-height: 64px;
    border: none;
    border-radius: 14px;
    background: var(--teal);
    color: #fff;
    font-family: inherit;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  #mic:active { filter: brightness(0.9); }

  body.recording #mic { background: var(--rec); }

  #mic:disabled {
    background: var(--ink-soft);
    opacity: 0.6;
  }

  button:focus-visible {
    outline: 3px solid var(--teal);
    outline-offset: 2px;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(150px + var(--pad-bottom));
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  #toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>음성 받아쓰기</h1>
  <span id="meta">0자</span>
</header>

<div id="status"><span id="dot"></span><span id="statusText">마이크 버튼을 눌러 시작하세요</span></div>

<main id="sheet">
  <div id="text" contenteditable="true" spellcheck="false"></div>
  <span id="interim"></span>
  <div id="empty">
    말하는 대로 이곳에 글이 쌓입니다.<br>
    받아쓴 글은 직접 눌러서 고칠 수 있습니다.<br>
    내용은 이 폰에 자동 보관되고, 저장을 누르면 텍스트 파일로 내려받습니다.
  </div>
</main>

<footer>
  <div id="tools">
    <button class="tool" id="btnBreak">줄바꿈</button>
    <button class="tool" id="btnCopy">복사</button>
    <button class="tool" id="btnSave">저장</button>
    <button class="tool" id="btnShare">공유</button>
    <button class="tool" id="btnClear">비우기</button>
  </div>
  <button id="mic">녹음 시작</button>
</footer>

<div id="toast"></div>

<script>
(function () {
  var textEl = document.getElementById('text');
  var interimEl = document.getElementById('interim');
  var emptyEl = document.getElementById('empty');
  var sheetEl = document.getElementById('sheet');
  var micBtn = document.getElementById('mic');
  var statusText = document.getElementById('statusText');
  var metaEl = document.getElementById('meta');
  var toastEl = document.getElementById('toast');

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;
  var wantRecording = false;
  var wakeLock = null;
  var startedAt = 0;
  var timerId = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
  }

  function refreshMeta() {
    var n = textEl.innerText.replace(/\s/g, '').length;
    var suffix = '';
    if (wantRecording && startedAt) {
      var s = Math.floor((Date.now() - startedAt) / 1000);
      var m = Math.floor(s / 60);
      suffix = ' · ' + m + ':' + String(s % 60).padStart(2, '0');
    }
    metaEl.textContent = n + '자' + suffix;
    emptyEl.style.display = textEl.innerText.trim() ? 'none' : 'block';
  }

  function scrollToEnd() {
    sheetEl.scrollTop = sheetEl.scrollHeight;
  }

  if (!SR) {
    statusText.textContent = '이 브라우저는 음성 인식을 지원하지 않습니다';
    micBtn.disabled = true;
    emptyEl.innerHTML = '안드로이드는 <b>Chrome</b>, 아이폰은 <b>Safari</b>에서 열어주세요.<br>' +
      '카카오톡·네이버 앱 안의 브라우저에서는 동작하지 않습니다. ' +
      '링크를 길게 눌러 기본 브라우저로 열면 됩니다.';
    refreshMeta();
    return;
  }

  function appendFinal(s) {
    s = s.trim();
    if (!s) return;
    var cur = textEl.innerText;
    var needSpace = cur.length > 0 && !/[\s\n]$/.test(cur);
    textEl.innerText = cur + (needSpace ? ' ' : '') + s;
    refreshMeta();
    scrollToEnd();
  }

  function buildRecognition() {
    var r = new SR();
    r.lang = 'ko-KR';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onresult = function (e) {
      var interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) appendFinal(t);
        else interim += t;
      }
      interimEl.textContent = interim ? ' ' + interim : '';
      if (interim) scrollToEnd();
    };

    r.onerror = function (e) {
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        wantRecording = false;
        statusText.textContent = '마이크 권한이 차단되어 있습니다. 브라우저 설정에서 허용해주세요';
        applyState();
      } else if (e.error === 'network') {
        statusText.textContent = '네트워크 연결을 확인해주세요 (인터넷 필요)';
      } else {
        statusText.textContent = '오류: ' + e.error;
      }
    };

    r.onend = function () {
      interimEl.textContent = '';
      if (wantRecording) {
        setTimeout(function () {
          if (!wantRecording) return;
          try { r.start(); } catch (err) { /* 이미 시작된 경우 무시 */ }
        }, 250);
      } else {
        applyState();
      }
    };

    return r;
  }

  function applyState() {
    document.body.classList.toggle('recording', wantRecording);
    micBtn.textContent = wantRecording ? '녹음 정지' : '녹음 시작';
    if (wantRecording) {
      statusText.textContent = '듣는 중 — 편하게 말씀하세요';
    } else if (!/권한|네트워크|오류/.test(statusText.textContent)) {
      statusText.textContent = '정지됨';
    }
  }

  async function lockScreen() {
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) { /* 지원하지 않으면 무시 */ }
  }

  function unlockScreen() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }

  function start() {
    wantRecording = true;
    recognition = buildRecognition();
    try { recognition.start(); } catch (err) {}
    startedAt = Date.now();
    timerId = setInterval(refreshMeta, 1000);
    lockScreen();
    applyState();
  }

  function stop() {
    wantRecording = false;
    if (recognition) { try { recognition.stop(); } catch (err) {} }
    clearInterval(timerId);
    startedAt = 0;
    unlockScreen();
    applyState();
    refreshMeta();
  }

  micBtn.addEventListener('click', function () {
    if (wantRecording) stop(); else start();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && wantRecording && !wakeLock) lockScreen();
  });

  document.getElementById('btnBreak').addEventListener('click', function () {
    textEl.innerText = textEl.innerText.replace(/\s+$/, '') + '\n\n';
    refreshMeta();
    scrollToEnd();
  });

  document.getElementById('btnCopy').addEventListener('click', async function () {
    var t = textEl.innerText.trim();
    if (!t) { toast('복사할 내용이 없습니다'); return; }
    try {
      await navigator.clipboard.writeText(t);
      toast('복사했습니다');
    } catch (err) {
      var ta = document.createElement('textarea');
      ta.value = t;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast('복사했습니다');
    }
  });

  function stamp() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
           '_' + p(d.getHours()) + p(d.getMinutes());
  }

  document.getElementById('btnSave').addEventListener('click', function () {
    var t = textEl.innerText.trim();
    if (!t) { toast('저장할 내용이 없습니다'); return; }
    var blob = new Blob(['\uFEFF' + t], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '받아쓰기_' + stamp() + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('다운로드 폴더에 저장했습니다');
  });

  document.getElementById('btnShare').addEventListener('click', async function () {
    var t = textEl.innerText.trim();
    if (!t) { toast('공유할 내용이 없습니다'); return; }
    if (navigator.share) {
      try { await navigator.share({ text: t }); } catch (err) {}
    } else {
      document.getElementById('btnSave').click();
    }
  });

  var KEY = 'voice-notes-draft';

  function keep() {
    try { localStorage.setItem(KEY, textEl.innerText); } catch (err) {}
  }

  function restore() {
    try {
      var saved = localStorage.getItem(KEY);
      if (saved && saved.trim()) {
        textEl.innerText = saved;
        statusText.textContent = '지난 내용을 불러왔습니다';
      }
    } catch (err) {}
  }

  setInterval(keep, 3000);
  window.addEventListener('pagehide', keep);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') keep();
  });
  restore();

  document.getElementById('btnClear').addEventListener('click', function () {
    if (!textEl.innerText.trim()) return;
    if (confirm('받아쓴 내용을 모두 지울까요?')) {
      textEl.innerText = '';
      interimEl.textContent = '';
      try { localStorage.removeItem(KEY); } catch (err) {}
      refreshMeta();
    }
  });

  textEl.addEventListener('input', refreshMeta);
  refreshMeta();
})();
</script>

</body>
</html>
