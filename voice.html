<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151B22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>음성 받아쓰기</title>
<style>
  :root {
    --ink: #151B22;
    --ink-soft: #5A6672;
    --paper: #EDF0F3;
    --line: #D3DAE1;
    --teal: #1F6F6B;
    --rec: #C8362B;
    --pad-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; height: 100%; overflow: hidden; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    font-size: 17px;
    line-height: 1.6;
  }

  header {
    flex: 0 0 auto;
    padding: 12px 18px 10px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }

  #meta {
    margin-left: auto;
    font-size: 13px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  #langbar {
    flex: 0 0 auto;
    display: flex;
    gap: 6px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
  }

  .lang {
    flex: 1 1 0;
    min-height: 40px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
  }

  .lang[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }

  #status {
    flex: 0 0 auto;
    padding: 8px 18px;
    font-size: 13px;
    color: var(--ink-soft);
    background: #E3E8ED;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
  }

  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-soft); flex: 0 0 auto; }

  body.recording #dot { background: var(--rec); animation: pulse 1.2s ease-in-out infinite; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  @media (prefers-reduced-motion: reduce) { body.recording #dot { animation: none; } }

  #sheet {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 18px 24px;
  }

  #text {
    white-space: pre-wrap;
    word-break: break-word;
    outline: none;
    min-height: 100%;
    font-size: 18px;
  }

  #interim { color: var(--ink-soft); }

  #empty { color: var(--ink-soft); font-size: 15px; line-height: 1.8; }

  footer {
    flex: 0 0 auto;
    border-top: 1px solid var(--line);
    background: var(--paper);
    padding: 12px 14px calc(12px + var(--pad-bottom));
  }

  #tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

  .tool {
    flex: 1 1 30%;
    min-height: 44px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
  }

  .tool:active { background: #E3E8ED; }

  #mic {
    width: 100%;
    min-height: 62px;
    border: none;
    border-radius: 14px;
    background: var(--teal);
    color: #fff;
    font-family: inherit;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  #mic:active { filter: brightness(0.9); }

  body.recording #mic { background: var(--rec); }

  #mic:disabled { background: var(--ink-soft); opacity: 0.6; }

  button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(160px + var(--pad-bottom));
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    max-width: 80%;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  #toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>음성 받아쓰기</h1>
  <span id="meta">0자</span>
</header>

<div id="langbar">
  <button class="lang" id="langKo" aria-pressed="true">한국어</button>
  <button class="lang" id="langEn" aria-pressed="false">English</button>
</div>

<div id="status"><span id="dot"></span><span id="statusText">마이크 버튼을 눌러 시작하세요</span></div>

<main id="sheet">
  <div id="text" contenteditable="true" spellcheck="false"></div>
  <span id="interim"></span>
  <div id="empty">
    말하는 대로 이곳에 글이 쌓입니다.<br>
    받아쓴 글은 직접 눌러서 고칠 수 있습니다.<br>
    내용은 이 폰에 자동 보관되고, 저장을 누르면 텍스트 파일로 내려받습니다.
  </div>
</main>

<footer>
  <div id="tools">
    <button class="tool" id="btnBreak">줄바꿈</button>
    <button class="tool" id="btnCopy">복사</button>
    <button class="tool" id="btnSave">저장</button>
    <button class="tool" id="btnShare">공유</button>
    <button class="tool" id="btnDict">단어 교정</button>
    <button class="tool" id="btnClear">비우기</button>
  </div>
  <button id="mic">녹음 시작</button>
</footer>

<div id="toast"></div>

<script>
(function () {
  var textEl = document.getElementById('text');
  var interimEl = document.getElementById('interim');
  var emptyEl = document.getElementById('empty');
  var sheetEl = document.getElementById('sheet');
  var micBtn = document.getElementById('mic');
  var statusText = document.getElementById('statusText');
  var metaEl = document.getElementById('meta');
  var toastEl = document.getElementById('toast');
  var langKoBtn = document.getElementById('langKo');
  var langEnBtn = document.getElementById('langEn');

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;
  var wantRecording = false;
  var wakeLock = null;
  var startedAt = 0;
  var timerId = null;
  var lang = 'ko-KR';

  var KEY_TEXT = 'voice-notes-draft';
  var KEY_LANG = 'voice-notes-lang';
  var KEY_DICT = 'voice-notes-dict';

  var baseDict = {
    'ko-KR': {
      '빙정 핵': '빙정핵',
      '인공 강우': '인공강우',
      '인공 강수': '인공강수',
      '구름 물리': '구름물리',
      '시딩': '씨딩',
      '기상 청': '기상청',
      '국립 기상 과학원': '국립기상과학원',
      '라디오 존데': '라디오존데',
      '이중 편파': '이중편파',
      '적설 하중': '적설하중',
      '수치 예보': '수치예보',
      '다운 스케일링': '다운스케일링'
    },
    'en-US': {
      'ice nuclear': 'ice nucleating',
      'i n p': 'INP',
      'w r f': 'WRF',
      'c c n': 'CCN',
      'cloud seating': 'cloud seeding',
      'super cooled': 'supercooled'
    }
  };

  var userDict = {};

  function loadDict() {
    try {
      var raw = localStorage.getItem(KEY_DICT);
      if (raw) userDict = JSON.parse(raw);
    } catch (err) { userDict = {}; }
  }

  function saveDict() {
    try { localStorage.setItem(KEY_DICT, JSON.stringify(userDict)); } catch (err) {}
  }

  function escapeRe(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function correct(s) {
    var table = {};
    var k;
    for (k in baseDict[lang]) table[k] = baseDict[lang][k];
    for (k in userDict) table[k] = userDict[k];
    for (k in table) {
      s = s.replace(new RegExp(escapeRe(k), 'gi'), table[k]);
    }
    return s;
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  function refreshMeta() {
    var n = textEl.innerText.replace(/\s/g, '').length;
    var suffix = '';
    if (wantRecording && startedAt) {
      var s = Math.floor((Date.now() - startedAt) / 1000);
      suffix = ' · ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }
    metaEl.textContent = n + '자' + suffix;
    emptyEl.style.display = textEl.innerText.trim() ? 'none' : 'block';
  }

  function scrollToEnd() { sheetEl.scrollTop = sheetEl.scrollHeight; }

  if (!SR) {
    statusText.textContent = '이 브라우저는 음성 인식을 지원하지 않습니다';
    micBtn.disabled = true;
    emptyEl.innerHTML = '안드로이드는 <b>Chrome</b>, 아이폰은 <b>Safari</b>에서 열어주세요.<br>' +
      '카카오톡·메신저 안의 브라우저에서는 마이크를 쓸 수 없습니다.';
    refreshMeta();
    return;
  }

  function appendFinal(s) {
    s = correct(s.trim());
    if (!s) return;
    var cur = textEl.innerText;
    var needSpace = cur.length > 0 && !/[\s\n]$/.test(cur);
    textEl.innerText = cur + (needSpace ? ' ' : '') + s;
    refreshMeta();
    scrollToEnd();
    keep();
  }

  function bestOf(result) {
    var best = result[0];
    for (var i = 1; i < result.length; i++) {
      if ((result[i].confidence || 0) > (best.confidence || 0)) best = result[i];
    }
    return best.transcript;
  }

  function buildRecognition() {
    var r = new SR();
    r.lang = lang;
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 3;

    r.onresult = function (e) {
      var interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) appendFinal(bestOf(e.results[i]));
        else interim += e.results[i][0].transcript;
      }
      interimEl.textContent = interim ? ' ' + interim : '';
      if (interim) scrollToEnd();
    };

    r.onerror = function (e) {
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        wantRecording = false;
        statusText.textContent = '마이크 권한이 차단되어 있습니다. 브라우저 설정에서 허용해주세요';
        applyState();
      } else if (e.error === 'network') {
        statusText.textContent = '네트워크 연결을 확인해주세요 (인터넷 필요)';
      } else {
        statusText.textContent = '오류: ' + e.error;
      }
    };

    r.onend = function () {
      interimEl.textContent = '';
      if (wantRecording) {
        setTimeout(function () {
          if (!wantRecording) return;
          try { r.start(); } catch (err) {}
        }, 250);
      } else {
        applyState();
      }
    };

    return r;
  }

  function applyState() {
    document.body.classList.toggle('recording', wantRecording);
    micBtn.textContent = wantRecording ? '녹음 정지' : '녹음 시작';
    if (wantRecording) {
      statusText.textContent = lang === 'ko-KR'
        ? '한국어를 듣는 중 — 편하게 말씀하세요'
        : 'Listening in English — speak naturally';
    } else if (!/권한|네트워크|오류/.test(statusText.textContent)) {
      statusText.textContent = '정지됨';
    }
  }

  async function lockScreen() {
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) {}
  }

  function unlockScreen() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }

  function start() {
    wantRecording = true;
    recognition = buildRecognition();
    try { recognition.start(); } catch (err) {}
    startedAt = Date.now();
    timerId = setInterval(refreshMeta, 1000);
    lockScreen();
    applyState();
  }

  function stop() {
    wantRecording = false;
    if (recognition) { try { recognition.stop(); } catch (err) {} }
    clearInterval(timerId);
    startedAt = 0;
    unlockScreen();
    applyState();
    refreshMeta();
    keep();
  }

  function setLang(next) {
    if (lang === next) return;
    lang = next;
    langKoBtn.setAttribute('aria-pressed', String(lang === 'ko-KR'));
    langEnBtn.setAttribute('aria-pressed', String(lang === 'en-US'));
    try { localStorage.setItem(KEY_LANG, lang); } catch (err) {}
    if (wantRecording) {
      wantRecording = false;
      if (recognition) { try { recognition.abort(); } catch (err) {} }
      setTimeout(function () {
        wantRecording = true;
        recognition = buildRecognition();
        try { recognition.start(); } catch (err) {}
        applyState();
      }, 300);
    } else {
      toast(lang === 'ko-KR' ? '한국어로 인식합니다' : 'Recognizing English');
    }
  }

  langKoBtn.addEventListener('click', function () { setLang('ko-KR'); });
  langEnBtn.addEventListener('click', function () { setLang('en-US'); });

  micBtn.addEventListener('click', function () {
    if (wantRecording) stop(); else start();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') keep();
    else if (wantRecording && !wakeLock) lockScreen();
  });

  document.getElementById('btnBreak').addEventListener('click', function () {
    textEl.innerText = textEl.innerText.replace(/\s+$/, '') + '\n\n';
    refreshMeta();
    scrollToEnd();
    keep();
  });

  document.getElementById('btnCopy').addEventListener('click', async function () {
    var t = textEl.innerText.trim();
    if (!t) { toast('복사할 내용이 없습니다'); return; }
    try {
      await navigator.clipboard.writeText(t);
      toast('복사했습니다');
    } catch (err) {
      var ta = document.createElement('textarea');
      ta.value = t;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast('복사했습니다');
    }
  });

  function stamp() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
           '_' + p(d.getHours()) + p(d.getMinutes());
  }

  document.getElementById('btnSave').addEventListener('click', function () {
    var t = textEl.innerText.trim();
    if (!t) { toast('저장할 내용이 없습니다'); return; }
    var blob = new Blob(['\uFEFF' + t], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '받아쓰기_' + stamp() + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('다운로드 폴더에 저장했습니다');
  });

  document.getElementById('btnShare').addEventListener('click', async function () {
    var t = textEl.innerText.trim();
    if (!t) { toast('공유할 내용이 없습니다'); return; }
    if (navigator.share) {
      try { await navigator.share({ text: t }); } catch (err) {}
    } else {
      document.getElementById('btnSave').click();
    }
  });

  document.getElementById('btnDict').addEventListener('click', function () {
    var n = Object.keys(userDict).length;
    var input = prompt(
      '자주 틀리는 말을 등록하세요. 잘못 들린 말과 고칠 말을 쉼표로 구분합니다.\n' +
      '예) 빙전 핵, 빙정핵\n\n' +
      '등록된 단어 ' + n + '개. 모두 지우려면 "초기화"라고 입력하세요.', '');
    if (input === null) return;
    input = input.trim();
    if (!input) return;
    if (input === '초기화') {
      userDict = {};
      saveDict();
      toast('등록한 단어를 모두 지웠습니다');
      return;
    }
    var idx = input.indexOf(',');
    if (idx < 1) { toast('쉼표로 구분해서 입력해주세요'); return; }
    var from = input.slice(0, idx).trim();
    var to = input.slice(idx + 1).trim();
    if (!from || !to) { toast('두 단어를 모두 입력해주세요'); return; }
    userDict[from] = to;
    saveDict();
    toast(from + ' → ' + to + ' 등록');
  });

  document.getElementById('btnClear').addEventListener('click', function () {
    if (!textEl.innerText.trim()) return;
    if (confirm('받아쓴 내용을 모두 지울까요?')) {
      textEl.innerText = '';
      interimEl.textContent = '';
      try { localStorage.removeItem(KEY_TEXT); } catch (err) {}
      refreshMeta();
    }
  });

  function keep() {
    try { localStorage.setItem(KEY_TEXT, textEl.innerText); } catch (err) {}
  }

  function restore() {
    try {
      var savedLang = localStorage.getItem(KEY_LANG);
      if (savedLang === 'en-US') {
        lang = 'en-US';
        langKoBtn.setAttribute('aria-pressed', 'false');
        langEnBtn.setAttribute('aria-pressed', 'true');
      }
      var saved = localStorage.getItem(KEY_TEXT);
      if (saved && saved.trim()) {
        textEl.innerText = saved;
        statusText.textContent = '지난 내용을 불러왔습니다';
      }
    } catch (err) {}
  }

  setInterval(keep, 3000);
  window.addEventListener('pagehide', keep);
  textEl.addEventListener('input', refreshMeta);

  loadDict();
  restore();
  refreshMeta();
})();
</script>

</body>
</html>
